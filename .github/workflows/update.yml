name: Update SUBBY Predictions

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Get football matches
        env:
          SPORTS_API_KEY: ${{ secrets.SPORTS_API_KEY }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          END=$(date -u -d "+3 days" +%Y-%m-%d)

          curl -fsSL \
            -H "x-apisports-key: $SPORTS_API_KEY" \
            "https://v3.football.api-sports.io/fixtures?from=$TODAY&to=$END" \
            -o football.json

      - name: Get basketball matches
        env:
          SPORTS_API_KEY: ${{ secrets.SPORTS_API_KEY }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          DAY2=$(date -u -d "+1 day" +%Y-%m-%d)
          DAY3=$(date -u -d "+2 days" +%Y-%m-%d)

          curl -fsSL \
            -H "x-apisports-key: $SPORTS_API_KEY" \
            "https://v1.basketball.api-sports.io/games?date=$TODAY" \
            -o basketball1.json

          curl -fsSL \
            -H "x-apisports-key: $SPORTS_API_KEY" \
            "https://v1.basketball.api-sports.io/games?date=$DAY2" \
            -o basketball2.json

          curl -fsSL \
            -H "x-apisports-key: $SPORTS_API_KEY" \
            "https://v1.basketball.api-sports.io/games?date=$DAY3" \
            -o basketball3.json

          jq -s '
            {
              get: {
                parameters: {
                  dates: [
                    .[0].parameters.date,
                    .[1].parameters.date,
                    .[2].parameters.date
                  ]
                }
              },
              errors: (
                [.[].errors] |
                map(select(length > 0)) |
                add // {}
              ),
              results: ([.[].results] | add),
              response: ([.[].response] | add)
            }
          ' basketball1.json basketball2.json basketball3.json > basketball.json

      - name: Save update time
        run: |
          echo "{\"updated\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > update.json

      - name: Save match data
        run: |
          git config user.name "SUBBY PREDICTION"
          git config user.email "actions@github.com"
          git add football.json basketball.json update.json
          git diff --cached --quiet || git commit -m "Update SUBBY match data"
          git push