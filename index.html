<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SUBBY PREDICTION 🏀⚽️</title>

<style>
* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #05070b;
  color: #fff;
}

button,
input {
  font: inherit;
}

/* HEADER */
header {
  background: #080b12;
  border-bottom: 1px solid #202632;
  padding: 25px 15px 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 29px;
  font-weight: 900;
  letter-spacing: .3px;
}

header p {
  margin: 8px 0 0;
  color: #9ca3af;
  font-size: 14px;
}

/* SEARCH */
.search-box {
  padding: 15px;
  background: #080b12;
  border-bottom: 1px solid #202632;
}

.search-box input {
  width: 100%;
  padding: 14px 16px;
  border-radius: 12px;
  border: 1px solid #303846;
  background: #11151d;
  color: #fff;
  font-size: 16px;
  outline: none;
}

.search-box input::placeholder {
  color: #6b7280;
}

.search-box input:focus {
  border-color: #fff;
}

/* FILTERS */
.filters {
  display: flex;
  gap: 8px;
  padding: 12px 15px;
  background: #080b12;
  border-bottom: 1px solid #202632;
  overflow-x: auto;
  scrollbar-width: none;
}

.filters::-webkit-scrollbar {
  display: none;
}

.filter {
  border: 1px solid #303846;
  background: #11151d;
  color: #d1d5db;
  padding: 10px 16px;
  border-radius: 20px;
  font-size: 14px;
  white-space: nowrap;
  cursor: pointer;
  transition: .2s;
}

.filter:hover {
  border-color: #fff;
}

.filter.active {
  background: #fff;
  color: #05070b;
  border-color: #fff;
  font-weight: 700;
}

/* MATCH CONTAINER */
#matches {
  max-width: 1000px;
  margin: auto;
  padding: 15px;
}

/* DAY */
.day-title {
  margin: 22px 0 10px;
  font-size: 18px;
  font-weight: 800;
  color: #fff;
}

/* CARD */
.card {
  background: #0d1118;
  border: 1px solid #252c38;
  border-radius: 16px;
  margin-bottom: 14px;
  overflow: hidden;
  transition: transform .15s, border-color .15s;
}

.card:hover {
  border-color: #3b4555;
}

/* CARD TOP */
.card-top {
  padding: 13px 15px;
  border-bottom: 1px solid #222936;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.sport {
  font-size: 12px;
  font-weight: 800;
  color: #aeb6c3;
  text-transform: uppercase;
}

.status {
  font-size: 11px;
  font-weight: 800;
  padding: 5px 8px;
  border-radius: 7px;
  background: #181e28;
  color: #d1d5db;
}

.status.live {
  background: #291416;
  color: #ff7b7b;
}

.status.finished {
  background: #16221a;
  color: #7ee29a;
}

/* TEAMS */
.teams {
  padding: 17px 15px;
  text-align: center;
}

.team {
  font-size: 18px;
  font-weight: 800;
  margin: 7px 0;
  line-height: 1.3;
}

.vs {
  color: #6b7280;
  font-size: 12px;
  margin: 3px 0;
  font-weight: 700;
}

.score {
  font-size: 23px;
  font-weight: 900;
  margin-top: 8px;
}

.time {
  color: #aeb6c3;
  font-size: 13px;
  margin-top: 8px;
}

/* PREDICTION */
.prediction-box {
  margin: 0 12px 12px;
  background: #11161f;
  border: 1px solid #2c3441;
  border-radius: 13px;
  padding: 14px;
}

.prediction-title {
  font-size: 12px;
  font-weight: 900;
  letter-spacing: .8px;
  color: #fff;
  margin-bottom: 10px;
}

.pick {
  background: #080b10;
  border: 1px solid #252c37;
  border-radius: 10px;
  padding: 11px;
  margin-top: 8px;
}

.pick-market {
  font-size: 11px;
  color: #9ca3af;
  margin-bottom: 4px;
}

.pick-value {
  font-size: 15px;
  font-weight: 800;
}

.confidence {
  margin-top: 5px;
  font-size: 11px;
  color: #aeb6c3;
}

.reason {
  padding: 0 14px 14px;
  color: #9ca3af;
  font-size: 12px;
  line-height: 1.5;
}

.no-pick {
  color: #f0c674;
  font-weight: 700;
  font-size: 14px;
}

/* MESSAGES */
.error,
.empty {
  text-align: center;
  padding: 45px 20px;
  color: #9ca3af;
}

.error {
  color: #ff8a8a;
}

.loading {
  text-align: center;
  padding: 45px 20px;
  color: #9ca3af;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 30px 15px;
  color: #7d8795;
  font-size: 12px;
  border-top: 1px solid #202632;
  margin-top: 20px;
}

.disclaimer {
  margin-top: 8px;
  color: #aeb6c3;
  font-weight: 700;
}

/* MOBILE */
@media (max-width: 600px) {
  header h1 {
    font-size: 25px;
  }

  .team {
    font-size: 17px;
  }

  #matches {
    padding: 12px;
  }
}
</style>
</head>

<body>

<header>
  <h1>SUBBY PREDICTION 🏀⚽️</h1>
  <p>Smart match analysis & predictions</p>
</header>

<div class="search-box">
  <input
    type="search"
    id="search"
    placeholder="🔎 Search team or match..."
    autocomplete="off"
    aria-label="Search matches"
  >
</div>

<div class="filters">
  <button class="filter active" data-filter="all">All</button>
  <button class="filter" data-filter="football">⚽ Football</button>
  <button class="filter" data-filter="basketball">🏀 Basketball</button>
</div>

<main id="matches">
  <div class="loading">Loading matches...</div>
</main>

<footer>
  <div>SUBBY PREDICTION</div>
  <div class="disclaimer">18+ | BET RESPONSIBLY</div>
  <div>Predictions are not guaranteed.</div>
</footer>

<script>
"use strict";

/* =========================================================
   GLOBAL STATE
========================================================= */

let allMatches = [];
let currentFilter = "all";
let currentSearch = "";
let isLoading = false;


/* =========================================================
   SECURITY
========================================================= */

function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================================================
   DATE / TIME
========================================================= */

const LAGOS_TIMEZONE = "Africa/Lagos";

function getValidDate(value) {
  if (!value) return null;

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return null;
  }

  return date;
}

function getLagosDateKey(date) {
  if (!date) return "";

  return new Intl.DateTimeFormat("en-CA", {
    timeZone: LAGOS_TIMEZONE,
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).format(date);
}

function formatDate(dateString) {
  const date = getValidDate(dateString);

  if (!date) return "";

  return new Intl.DateTimeFormat("en-NG", {
    timeZone: LAGOS_TIMEZONE,
    weekday: "short",
    day: "numeric",
    month: "short"
  }).format(date);
}

function formatTime(dateString) {
  const date = getValidDate(dateString);

  if (!date) return "";

  return new Intl.DateTimeFormat("en-NG", {
    timeZone: LAGOS_TIMEZONE,
    hour: "numeric",
    minute: "2-digit",
    hour12: true
  }).format(date);
}

function dayLabel(dateString) {
  const date = getValidDate(dateString);

  if (!date) {
    return "Matches";
  }

  const today = new Date();

  const todayKey = getLagosDateKey(today);
  const matchKey = getLagosDateKey(date);

  const tomorrow = new Date(
    today.getTime() + 24 * 60 * 60 * 1000
  );

  const tomorrowKey = getLagosDateKey(tomorrow);

  if (matchKey === todayKey) {
    return "Today";
  }

  if (matchKey === tomorrowKey) {
    return "Tomorrow";
  }

  return formatDate(dateString);
}


/* =========================================================
   STATUS
========================================================= */

function normalizeStatus(status) {
  return String(status ?? "")
    .trim()
    .toUpperCase();
}

function isFinished(status) {
  const value = normalizeStatus(status);

  return [
    "FT",
    "AET",
    "PEN",
    "CANC",
    "ABD",
    "AWD",
    "WO",
    "FIN",
    "FINAL",
    "ENDED"
  ].includes(value);
}

function isLive(status) {
  const value = normalizeStatus(status);

  return [
    "1H",
    "2H",
    "HT",
    "ET",
    "P",
    "LIVE",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "OT",
    "IN_PLAY",
    "INPLAY"
  ].includes(value);
}


/* =========================================================
   FOOTBALL
========================================================= */

function getFootballTeams(item) {
  return {
    home: item?.teams?.home?.name || "Home Team",
    away: item?.teams?.away?.name || "Away Team"
  };
}

function getFootballStatus(item) {
  return (
    item?.fixture?.status?.short ||
    item?.fixture?.status?.long ||
    ""
  );
}

function getFootballDate(item) {
  return item?.fixture?.date || "";
}

function getFootballScores(item) {
  return {
    home: item?.goals?.home,
    away: item?.goals?.away
  };
}


/* =========================================================
   BASKETBALL
========================================================= */

function getBasketballTeams(item) {
  return {
    home: item?.teams?.home?.name || "Home Team",
    away: item?.teams?.away?.name || "Away Team"
  };
}

function getBasketballStatus(item) {
  return (
    item?.status?.short ||
    item?.status?.long ||
    ""
  );
}

function getBasketballDate(item) {
  return item?.date || "";
}

function getBasketballScores(item) {
  return {
    home: item?.scores?.home?.total,
    away: item?.scores?.away?.total
  };
}


/* =========================================================
   PREDICTION ENGINE
========================================================= */

/*
   IMPORTANT:

   Do not create fake predictions.

   The JSON files need actual statistics such as:

   - recent results
   - goals/points scored
   - goals/points conceded
   - home/away form
   - head-to-head
   - standings
   - injuries
   - etc.

   If those statistics are not available, the page correctly
   shows "No strong pick" instead of pretending a prediction
   is statistically supported.
*/


function footballPrediction(item) {

  /*
    Future example:

    const stats = item.data.statistics;

    if (stats) {
      // Calculate prediction here.
    }
  */

  return {
    picks: [],
    reason:
      "Not enough recent team statistics are available for a reliable football market prediction."
  };
}


function basketballPrediction(item) {

  /*
    Future example:

    const stats = item.data.statistics;

    if (stats) {
      // Calculate prediction here.
    }
  */

  return {
    picks: [],
    reason:
      "Not enough recent team statistics are available for a reliable basketball market prediction."
  };
}


function predictionHTML(item) {

  const prediction =
    item.sport === "football"
      ? footballPrediction(item)
      : basketballPrediction(item);

  if (
    !prediction ||
    !Array.isArray(prediction.picks) ||
    prediction.picks.length === 0
  ) {

    return `
      <div class="prediction-box">
        <div class="prediction-title">
          SUBBY PREDICTION
        </div>

        <div class="no-pick">
          No strong pick
        </div>
      </div>

      <div class="reason">
        ${escapeHTML(prediction?.reason || "No prediction available.")}
      </div>
    `;
  }

  return `
    <div class="prediction-box">

      <div class="prediction-title">
        SUBBY PREDICTION
      </div>

      ${prediction.picks.map(pick => `
        <div class="pick">

          <div class="pick-market">
            ${escapeHTML(pick.market)}
          </div>

          <div class="pick-value">
            ${escapeHTML(pick.value)}
          </div>

          ${
            pick.confidence !== undefined
              ? `
                <div class="confidence">
                  Confidence:
                  ${escapeHTML(pick.confidence)}%
                </div>
              `
              : ""
          }

        </div>
      `).join("")}

    </div>

    <div class="reason">
      ${escapeHTML(prediction.reason || "")}
    </div>
  `;
}


/* =========================================================
   CREATE CARD
========================================================= */

function makeCard(item) {

  const data = item.data;

  const teams =
    item.sport === "football"
      ? getFootballTeams(data)
      : getBasketballTeams(data);

  const status =
    item.sport === "football"
      ? getFootballStatus(data)
      : getBasketballStatus(data);

  const dateString =
    item.sport === "football"
      ? getFootballDate(data)
      : getBasketballDate(data);

  const scores =
    item.sport === "football"
      ? getFootballScores(data)
      : getBasketballScores(data);

  const finished = isFinished(status);
  const live = isLive(status);

  let statusClass = "";
  let statusText = "Scheduled";

  if (finished) {
    statusClass = "finished";
    statusText = "FT";
  } else if (live) {
    statusClass = "live";
    statusText = "LIVE";
  } else if (status) {
    statusText = status;
  }

  const hasScore =
    scores.home !== null &&
    scores.home !== undefined &&
    scores.away !== null &&
    scores.away !== undefined;

  const scoreHTML =
    (finished || live) && hasScore
      ? `
        <div class="score">
          ${escapeHTML(scores.home)}
          :
          ${escapeHTML(scores.away)}
        </div>
      `
      : "";

  const searchText = [
    item.sport,
    teams.home,
    teams.away
  ]
    .join(" ")
    .toLowerCase();

  return `
    <article
      class="card"
      data-search="${escapeHTML(searchText)}"
      data-sport="${escapeHTML(item.sport)}"
    >

      <div class="card-top">

        <div class="sport">
          ${
            item.sport === "football"
              ? "⚽ Football"
              : "🏀 Basketball"
          }
        </div>

        <div class="status ${statusClass}">
          ${escapeHTML(statusText)}
        </div>

      </div>

      <div class="teams">

        <div class="team">
          ${escapeHTML(teams.home)}
        </div>

        <div class="vs">
          VS
        </div>

        <div class="team">
          ${escapeHTML(teams.away)}
        </div>

        ${scoreHTML}

        ${
          dateString
            ? `
              <div class="time">
                ${escapeHTML(formatDate(dateString))}
                •
                ${escapeHTML(formatTime(dateString))}
              </div>
            `
            : ""
        }

      </div>

      ${predictionHTML(item)}

    </article>
  `;
}


/* =========================================================
   NORMALIZE API DATA
========================================================= */

function processFootball(data) {

  if (!data) return [];

  const response =
    Array.isArray(data.response)
      ? data.response
      : Array.isArray(data)
        ? data
        : [];

  return response
    .filter(item => item)
    .map(item => {

      const teams = getFootballTeams(item);

      return {
        sport: "football",
        data: item,
        home: teams.home,
        away: teams.away,
        date: getFootballDate(item),

        id:
          item?.fixture?.id ||
          `${teams.home}-${teams.away}-${getFootballDate(item)}`
      };
    });
}


function processBasketball(data) {

  if (!data) return [];

  const response =
    Array.isArray(data.response)
      ? data.response
      : Array.isArray(data)
        ? data
        : [];

  return response
    .filter(item => item)
    .map(item => {

      const teams = getBasketballTeams(item);

      return {
        sport: "basketball",
        data: item,
        home: teams.home,
        away: teams.away,
        date: getBasketballDate(item),

        id:
          item?.id ||
          `${teams.home}-${teams.away}-${getBasketballDate(item)}`
      };
    });
}


/* =========================================================
   REMOVE DUPLICATES
========================================================= */

function removeDuplicates(matches) {

  const seen = new Set();

  return matches.filter(match => {

    const key =
      `${match.sport}-${match.id}`;

    if (seen.has(key)) {
      return false;
    }

    seen.add(key);

    return true;
  });
}


/* =========================================================
   FILTER + RENDER
========================================================= */

function render() {

  const container =
    document.getElementById("matches");

  let filtered = allMatches.filter(item => {

    const sportMatch =
      currentFilter === "all" ||
      item.sport === currentFilter;

    const text = [
      item.sport,
      item.home,
      item.away
    ]
      .join(" ")
      .toLowerCase();

    const searchMatch =
      !currentSearch ||
      text.includes(currentSearch.toLowerCase());

    return sportMatch && searchMatch;
  });


  /* SORT BY DATE */

  filtered.sort((a, b) => {

    const dateA =
      getValidDate(a.date)?.getTime() ||
      Number.MAX_SAFE_INTEGER;

    const dateB =
      getValidDate(b.date)?.getTime() ||
      Number.MAX_SAFE_INTEGER;

    return dateA - dateB;
  });


  if (!filtered.length) {

    container.innerHTML = `
      <div class="empty">
        No matches found.
      </div>
    `;

    return;
  }


  /* GROUP BY DAY */

  const groups = {};

  filtered.forEach(item => {

    const label = dayLabel(item.date);

    if (!groups[label]) {
      groups[label] = [];
    }

    groups[label].push(item);
  });


  container.innerHTML =
    Object.entries(groups)
      .map(([label, items]) => {

        return `
          <section>

            <div class="day-title">
              ${escapeHTML(label)}
            </div>

            ${items.map(makeCard).join("")}

          </section>
        `;
      })
      .join("");
}


/* =========================================================
   LOAD JSON
========================================================= */

async function loadJSON(file) {

  try {

    const response =
      await fetch(`${file}?v=${Date.now()}`, {
        cache: "no-store"
      });

    if (!response.ok) {
      throw new Error(
        `${file} returned HTTP ${response.status}`
      );
    }

    const data =
      await response.json();

    return data;

  } catch (error) {

    console.error(`Error loading ${file}:`, error);

    return null;
  }
}


/* =========================================================
   LOAD MATCHES
========================================================= */

async function loadMatches() {

  if (isLoading) {
    return;
  }

  isLoading = true;

  const container =
    document.getElementById("matches");

  if (!allMatches.length) {

    container.innerHTML = `
      <div class="loading">
        Loading matches...
      </div>
    `;
  }


  try {

    const [
      footballData,
      basketballData
    ] = await Promise.all([
      loadJSON("football.json"),
      loadJSON("basketball.json")
    ]);


    const football =
      processFootball(footballData);

    const basketball =
      processBasketball(basketballData);


    allMatches = removeDuplicates([
      ...football,
      ...basketball
    ]);


    if (!allMatches.length) {

      let message =
        "No matches are available right now.";

      if (!footballData && !basketballData) {
        message =
          "Unable to load football.json or basketball.json.";
      } else if (!footballData) {
        message =
          "Football data could not be loaded.";
      } else if (!basketballData) {
        message =
          "Basketball data could not be loaded.";
      }

      container.innerHTML = `
        <div class="error">
          ${escapeHTML(message)}
        </div>
      `;

      return;
    }


    render();

  } catch (error) {

    console.error("Match loading error:", error);

    container.innerHTML = `
      <div class="error">
        Something went wrong while loading matches.
      </div>
    `;

  } finally {

    isLoading = false;
  }
}


/* =========================================================
   FILTER BUTTONS
========================================================= */

document
  .querySelectorAll(".filter")
  .forEach(button => {

    button.addEventListener("click", () => {

      document
        .querySelectorAll(".filter")
        .forEach(btn =>
          btn.classList.remove("active")
        );

      button.classList.add("active");

      currentFilter =
        button.dataset.filter || "all";

      render();
    });
  });


/* =========================================================
   SEARCH
========================================================= */

document
  .getElementById("search")
  .addEventListener("input", event => {

    currentSearch =
      event.target.value.trim();

    render();
  });


/* =========================================================
   INITIAL LOAD
========================================================= */

loadMatches();


/* =========================================================
   AUTO REFRESH
   Every 5 minutes
========================================================= */

setInterval(() => {

  loadMatches();

}, 5 * 60 * 1000);

</script>

</body>
</html>
