<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SUBBY PREDICTION 🏀⚽️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #05070b;
  color: #ffffff;
}

header {
  background: #080b12;
  border-bottom: 1px solid #202632;
  padding: 25px 15px 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 29px;
  font-weight: 900;
  letter-spacing: .3px;
}

header p {
  margin: 8px 0 0;
  color: #9ca3af;
  font-size: 14px;
}

.search-box {
  padding: 15px;
  background: #080b12;
  border-bottom: 1px solid #202632;
}

.search-box input {
  width: 100%;
  padding: 14px 16px;
  border-radius: 12px;
  border: 1px solid #303846;
  background: #11151d;
  color: white;
  font-size: 16px;
  outline: none;
}

.search-box input:focus {
  border-color: #ffffff;
}

.filters {
  display: flex;
  gap: 8px;
  padding: 12px 15px;
  background: #080b12;
  overflow-x: auto;
}

.filter {
  border: 1px solid #303846;
  background: #11151d;
  color: #d1d5db;
  padding: 10px 16px;
  border-radius: 20px;
  font-size: 14px;
  white-space: nowrap;
  cursor: pointer;
}

.filter.active {
  background: #ffffff;
  color: #05070b;
  border-color: #ffffff;
  font-weight: 700;
}

#matches {
  max-width: 1000px;
  margin: auto;
  padding: 15px;
}

.day-title {
  margin: 22px 0 10px;
  font-size: 18px;
  font-weight: 800;
  color: #ffffff;
}

.card {
  background: #0d1118;
  border: 1px solid #252c38;
  border-radius: 16px;
  margin-bottom: 14px;
  overflow: hidden;
}

.card-top {
  padding: 13px 15px;
  border-bottom: 1px solid #222936;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.sport {
  font-size: 12px;
  font-weight: 800;
  color: #aeb6c3;
  text-transform: uppercase;
}

.status {
  font-size: 11px;
  font-weight: 800;
  padding: 5px 8px;
  border-radius: 7px;
  background: #181e28;
  color: #d1d5db;
}

.status.live {
  background: #291416;
  color: #ff7b7b;
}

.status.finished {
  background: #16221a;
  color: #7ee29a;
}

.teams {
  padding: 17px 15px;
  text-align: center;
}

.team {
  font-size: 18px;
  font-weight: 800;
  margin: 7px 0;
}

.vs {
  color: #6b7280;
  font-size: 12px;
  margin: 3px 0;
}

.score {
  font-size: 23px;
  font-weight: 900;
  margin-top: 8px;
}

.time {
  color: #aeb6c3;
  font-size: 13px;
  margin-top: 8px;
}

.prediction-box {
  margin: 0 12px 12px;
  background: #11161f;
  border: 1px solid #2c3441;
  border-radius: 13px;
  padding: 14px;
}

.prediction-title {
  font-size: 12px;
  font-weight: 900;
  letter-spacing: .8px;
  color: #ffffff;
  margin-bottom: 10px;
}

.pick {
  background: #080b10;
  border: 1px solid #252c37;
  border-radius: 10px;
  padding: 11px;
  margin-top: 8px;
}

.pick-market {
  font-size: 11px;
  color: #9ca3af;
  margin-bottom: 4px;
}

.pick-value {
  font-size: 15px;
  font-weight: 800;
}

.confidence {
  margin-top: 5px;
  font-size: 11px;
  color: #aeb6c3;
}

.reason {
  padding: 0 14px 14px;
  color: #9ca3af;
  font-size: 12px;
  line-height: 1.5;
}

.no-pick {
  color: #f0c674;
  font-weight: 700;
  font-size: 14px;
}

.error,
.empty {
  text-align: center;
  padding: 45px 20px;
  color: #9ca3af;
}

footer {
  text-align: center;
  padding: 30px 15px;
  color: #7d8795;
  font-size: 12px;
  border-top: 1px solid #202632;
  margin-top: 20px;
}

.disclaimer {
  margin-top: 8px;
  color: #aeb6c3;
  font-weight: 700;
}
</style>
</head>

<body>

<header>
  <h1>SUBBY PREDICTION 🏀⚽️</h1>
  <p>Smart match analysis & predictions</p>
</header>

<div class="search-box">
  <input
    type="search"
    id="search"
    placeholder="🔎 Search team or match..."
    autocomplete="off"
  >
</div>

<div class="filters">
  <button class="filter active" data-filter="all">All</button>
  <button class="filter" data-filter="football">⚽ Football</button>
  <button class="filter" data-filter="basketball">🏀 Basketball</button>
</div>

<main id="matches">
  <div class="empty">Loading matches...</div>
</main>

<footer>
  <div>SUBBY PREDICTION</div>
  <div class="disclaimer">18+ | BET RESPONSIBLY</div>
  <div>Predictions are not guaranteed.</div>
</footer>

<script>
let allMatches = [];
let currentFilter = "all";
let currentSearch = "";

function escapeHTML(text) {
  return String(text ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function getFootballTeams(item) {
  return {
    home: item?.teams?.home?.name || "Home Team",
    away: item?.teams?.away?.name || "Away Team"
  };
}

function getBasketballTeams(item) {
  return {
    home: item?.teams?.home?.name || "Home Team",
    away: item?.teams?.away?.name || "Away Team"
  };
}

function getFootballStatus(item) {
  return item?.fixture?.status?.short || "";
}

function getBasketballStatus(item) {
  return item?.status?.short || "";
}

function isFinished(status) {
  return [
    "FT",
    "AET",
    "PEN",
    "CANC",
    "ABD",
    "AWD",
    "WO",
    "FIN"
  ].includes(String(status).toUpperCase());
}

function isLive(status) {
  return [
    "1H",
    "2H",
    "HT",
    "ET",
    "P",
    "LIVE",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "OT"
  ].includes(String(status).toUpperCase());
}

function formatDate(dateString) {
  if (!dateString) return "";

  const date = new Date(dateString);

  if (isNaN(date.getTime())) return "";

  return new Intl.DateTimeFormat("en-NG", {
    timeZone: "Africa/Lagos",
    weekday: "short",
    day: "numeric",
    month: "short"
  }).format(date);
}

function formatTime(dateString) {
  if (!dateString) return "";

  const date = new Date(dateString);

  if (isNaN(date.getTime())) return "";

  return new Intl.DateTimeFormat("en-NG", {
    timeZone: "Africa/Lagos",
    hour: "2-digit",
    minute: "2-digit",
    hour12: true
  }).format(date);
}

function dayLabel(dateString) {
  if (!dateString) return "Matches";

  const date = new Date(dateString);
  const now = new Date();

  const today = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Africa/Lagos"
  }).format(now);

  const matchDay = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Africa/Lagos"
  }).format(date);

  const tomorrowDate = new Date(now);
  tomorrowDate.setDate(tomorrowDate.getDate() + 1);

  const tomorrow = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Africa/Lagos"
  }).format(tomorrowDate);

  if (matchDay === today) return "Today";
  if (matchDay === tomorrow) return "Tomorrow";

  return formatDate(dateString);
}

function footballPrediction(item) {
  /*
    IMPORTANT:
    The current football.json contains fixtures but does not
    contain enough recent team statistics to honestly calculate
    strong betting markets.

    Therefore we do NOT invent a prediction.
    Once recent-form/statistics are added to the API workflow,
    this function can calculate evidence-based markets.
  */

  return {
    picks: [],
    reason: "Not enough recent team statistics available yet for a reliable market prediction."
  };
}

function basketballPrediction(item) {
  /*
    Same rule for basketball.
    We do not manufacture points lines or winners without
    supporting scoring/form data.
  */

  return {
    picks: [],
    reason: "Not enough recent team statistics available yet for a reliable market prediction."
  };
}

function predictionHTML(item) {
  const prediction =
    item.sport === "football"
      ? footballPrediction(item)
      : basketballPrediction(item);

  if (!prediction.picks.length) {
    return `
      <div class="prediction-box">
        <div class="prediction-title">SUBBY PREDICTION</div>
        <div class="no-pick">No strong pick</div>
      </div>

      <div class="reason">
        ${escapeHTML(prediction.reason)}
      </div>
    `;
  }

  return `
    <div class="prediction-box">
      <div class="prediction-title">SUBBY PREDICTION</div>

      ${prediction.picks.map(pick => `
        <div class="pick">
          <div class="pick-market">${escapeHTML(pick.market)}</div>
          <div class="pick-value">${escapeHTML(pick.value)}</div>
          <div class="confidence">
            Confidence: ${escapeHTML(pick.confidence)}%
          </div>
        </div>
      `).join("")}
    </div>

    <div class="reason">
      ${escapeHTML(prediction.reason)}
    </div>
  `;
}

function makeCard(item) {
  const teams = item.sport === "football"
    ? getFootballTeams(item.data)
    : getBasketballTeams(item.data);

  const status = item.sport === "football"
    ? getFootballStatus(item.data)
    : getBasketballStatus(item.data);

  const dateString = item.sport === "football"
    ? item.data?.fixture?.date
    : item.data?.date;

  let homeScore = "";
  let awayScore = "";

  if (item.sport === "football") {
    homeScore = item.data?.goals?.home;
    awayScore = item.data?.goals?.away;
  } else {
    homeScore = item.data?.scores?.home?.total;
    awayScore = item.data?.scores?.away?.total;
  }

  const finished = isFinished(status);
  const live = isLive(status);

  let statusClass = "";
  if (finished) statusClass = "finished";
  if (live) statusClass = "live";

  let statusText = status || "Scheduled";

  if (finished) statusText = "FT";
  if (live) statusText = "LIVE";

  return `
    <article
      class="card"
      data-search="${escapeHTML(
        (teams.home + " " + teams.away).toLowerCase()
      )}"
      data-sport="${item.sport}"
    >

      <div class="card-top">
        <div class="sport">
          ${item.sport === "football" ? "⚽ Football" : "🏀 Basketball"}
        </div>

        <div class="status ${statusClass}">
          ${escapeHTML(statusText)}
        </div>
      </div>

      <div class="teams">

        <div class="team">
          ${escapeHTML(teams.home)}
        </div>

        <div class="vs">VS</div>

        <div class="team">
          ${escapeHTML(teams.away)}
        </div>

        ${
          finished || live
            ? `<div class="score">
                ${homeScore ?? "-"} : ${awayScore ?? "-"}
              </div>`
            : ""
        }

        <div class="time">
          ${formatDate(dateString)}
          ${dateString ? " • " + formatTime(dateString) : ""}
        </div>

      </div>

      ${predictionHTML(item)}

    </article>
  `;
}

function render() {
  const container = document.getElementById("matches");

  let filtered = allMatches.filter(item => {

    const sportMatch =
      currentFilter === "all" ||
      item.sport === currentFilter;

    const text =
      (
        item.sport +
        " " +
        item.home +
        " " +
        item.away
      ).toLowerCase();

    const searchMatch =
      !currentSearch ||
      text.includes(currentSearch.toLowerCase());

    return sportMatch && searchMatch;
  });

  filtered.sort((a, b) => {
    return new Date(a.date) - new Date(b.date);
  });

  if (!filtered.length) {
    container.innerHTML = `
      <div class="empty">
        No matches found.
      </div>
    `;
    return;
  }

  const groups = {};

  filtered.forEach(item => {
    const label = dayLabel(item.date);

    if (!groups[label]) {
      groups[label] = [];
    }

    groups[label].push(item);
  });

  container.innerHTML = Object.entries(groups)
    .map(([label, items]) => `
      <section>
        <div class="day-title">${escapeHTML(label)}</div>
        ${items.map(makeCard).join("")}
      </section>
    `)
    .join("");
}

async function loadJSON(file) {
  try {
    const response = await fetch(file + "?v=" + Date.now());

    if (!response.ok) {
      throw new Error("Unable to load " + file);
    }

    return await response.json();

  } catch (error) {
    console.error(error);
    return null;
  }
}

function processFootball(data) {
  if (!data || !Array.isArray(data.response)) {
    return [];
  }

  return data.response.map(item => ({
    sport: "football",
    data: item,
    home: item?.teams?.home?.name || "",
    away: item?.teams?.away?.name || "",
    date: item?.fixture?.date || ""
  }));
}

function processBasketball(data) {
  if (!data || !Array.isArray(data.response)) {
    return [];
  }

  return data.response.map(item => ({
    sport: "basketball",
    data: item,
    home: item?.teams?.home?.name || "",
    away: item?.teams?.away?.name || "",
    date: item?.date || ""
  }));
}

async function loadMatches() {
  const container = document.getElementById("matches");

  container.innerHTML = `
    <div class="empty">
      Loading matches...
    </div>
  `;

  const [football, basketball] = await Promise.all([
    loadJSON("football.json"),
    loadJSON("basketball.json")
  ]);

  allMatches = [
    ...processFootball(football),
    ...processBasketball(basketball)
  ];

  if (!allMatches.length) {
    container.innerHTML = `
      <div class="error">
        Unable to load matches right now.
      </div>
    `;
    return;
  }

  render();
}

document.querySelectorAll(".filter").forEach(button => {
  button.addEventListener("click", () => {

    document.querySelectorAll(".filter")
      .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    currentFilter = button.dataset.filter;

    render();
  });
});

document.getElementById("search").addEventListener("input", event => {
  currentSearch = event.target.value.trim();
  render();
});

loadMatches();

setInterval(loadMatches, 5 * 60 * 1000);
</script>

</body>
</html>
